databases:
  - name: ambalaj_db
    databaseName: ambalaj
    user: ambalaj_user

services:
  - type: web
    name: ambalaj-satis-web
    env: docker
    region: frankfurt
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ambalaj_db
          property: connectionString
      - key: APP_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://ambalaj-satis-web.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: ambalaj_db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ambalaj_db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: ambalaj_db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: ambalaj_db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ambalaj_db
          property: password
